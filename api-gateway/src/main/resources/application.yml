server:
  port: ${SERVER_PORT:8183}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}


spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user/**
              filters:
                - AddRequestHeader=color, blue
            - id: product-service
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/product/**
              filters:
                - AddRequestHeader=color, blue
            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/orders/**
              filters:
                - AddRequestHeader=color, blue
            - id: inventory-service
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/inventory/**
              filters:
                - AddRequestHeader=color, blue
            - id: ai-assistant-service
              uri: lb://AI-ASSISTANT-SERVICE
              predicates:
                - Path=/ai/**
              filters:
                - AddRequestHeader=color, blue

app:
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET:bmV4dXNfZGV2X2p3dF9zZWNyZXRfMzJfYnl0ZXMhISE=}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        http.server.requests: true
