global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "nexus-commerce-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8081"
          - "host.docker.internal:8084"
          - "host.docker.internal:8085"
          - "host.docker.internal:8086"
